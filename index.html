<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holly Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFCFA;
    --forest:#0B3D2E;
    --leaf:#3E9B63;
    --leaf-soft:#EAF7EE;
    --ink:#141A17;
    --muted:#6B7A72;
    --line:#DCE8E0;
    --white:#FFFFFF;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);}
  a{color:inherit;}

  /* ===== Hero ===== */
  header.hero{
    position:relative;
    padding:64px 24px 48px;
    background:linear-gradient(180deg,#0B3D2E 0%,#144F3B 100%);
    color:#fff;
    overflow:hidden;
  }
  header.hero::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      radial-gradient(circle at 12% 20%, rgba(255,255,255,0.06) 0, transparent 40%),
      radial-gradient(circle at 88% 80%, rgba(255,255,255,0.05) 0, transparent 45%);
  }
  .hero-inner{max-width:1000px;margin:0 auto;position:relative;}
  .eyebrow{
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    color:#9FE0B8; font-weight:600; margin-bottom:14px;
    display:flex;align-items:center;gap:10px;
  }
  .eyebrow::before{content:"";width:22px;height:1px;background:#9FE0B8;display:inline-block;}
  h1.title{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:clamp(42px,8vw,76px);
    line-height:0.98;
    margin:0 0 14px;
    letter-spacing:-0.01em;
  }
  h1.title .accent{color:#9FE0B8;font-style:italic;font-weight:600;}
  .tagline{font-size:16px;color:#CFE9D9;max-width:520px;line-height:1.6;margin:0;}

  .leaf-divider{
    height:6px;width:100%;
    background:repeating-linear-gradient(90deg,#3E9B63 0 22px, transparent 22px 34px);
    opacity:.7;
  }

  /* ===== Controls ===== */
  .controls{
    max-width:1000px;margin:-26px auto 0; padding:0 24px;
    position:relative; z-index:2;
  }
  .controls-card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 10px 30px -14px rgba(11,61,46,0.25);
    padding:16px;
    display:flex; gap:12px; flex-wrap:wrap; align-items:center;
  }
  .search-box{
    flex:1 1 220px;
    display:flex; align-items:center; gap:8px;
    border:1px solid var(--line); border-radius:10px; padding:10px 14px;
    background:#fff;
  }
  .search-box input{
    border:none;outline:none;font-family:'Inter',sans-serif;font-size:14px;width:100%;color:var(--ink);
  }
  select#roleFilter, select#houseFilter{
    border:1px solid var(--line); border-radius:10px; padding:10px 14px;
    font-family:'Inter',sans-serif; font-size:14px; color:var(--ink); background:#fff;
  }
  .count-tag{font-size:13px;color:var(--muted);white-space:nowrap;padding:0 4px;}

  /* ===== Grid ===== */
  main{max-width:1000px;margin:36px auto 100px;padding:0 24px;}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:18px;
  }
  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    position:relative;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .card::before{
    content:"";
    position:absolute; top:0; left:20px; width:26px; height:8px;
    background:var(--leaf);
    border-radius:0 0 6px 6px;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 14px 28px -18px rgba(11,61,46,0.35);
    border-color:#BFE3CC;
  }
  .card .role-badge{
    display:inline-block; font-size:11px; font-weight:600; letter-spacing:.05em;
    text-transform:uppercase; color:var(--forest); background:var(--leaf-soft);
    padding:4px 10px; border-radius:999px; margin-bottom:12px;
  }
  .card h3{
    font-family:'Fraunces',serif; font-size:22px; margin:0 0 2px; font-weight:600;
  }
  .card .charname{font-size:13.5px; color:var(--muted); margin:0 0 16px;}
  .card .charname b{color:var(--ink); font-weight:500;}
  .channels{display:flex; gap:8px; flex-wrap:wrap;}
  .chan-btn{
    display:inline-flex; align-items:center; gap:6px;
    font-size:13px; font-weight:600; text-decoration:none;
    padding:8px 12px; border-radius:8px; border:1px solid var(--line);
    color:var(--ink); background:#fff;
  }
  .chan-btn:hover{border-color:var(--leaf); color:var(--forest); background:var(--leaf-soft);}
  .chan-btn svg{width:15px;height:15px;flex:none;}
  .no-channel{font-size:12.5px; color:var(--muted); font-style:italic;}

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--muted);
  }
  .empty-state h3{font-family:'Fraunces',serif;color:var(--ink);font-size:22px;margin-bottom:6px;}


</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="eyebrow">Roster</div>
    <h1 class="title">Holly <span class="accent">Project</span></h1>
    <p class="tagline">รวมรายชื่อสมาชิก บทบาท และช่องทาง YouTube / TikTok ของทีมไว้ในที่เดียว</p>
  </div>
</header>
<div class="leaf-divider"></div>

<div class="controls">
  <div class="controls-card">
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7A72" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="ค้นหาชื่อตัวละคร, บทบาท, ตระกูล หรือชื่อช่อง...">
    </div>
    <select id="houseFilter"><option value="">ทุกตระกูล</option></select>
    <select id="roleFilter"><option value="">ทุกบทบาท</option></select>
    <span class="count-tag" id="countTag"></span>
  </div>
</div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <h3>ไม่พบรายชื่อ</h3>
    <p>ลองค้นหาด้วยคำอื่น หรือกดปุ่ม + เพื่อเพิ่มรายชื่อใหม่</p>
  </div>
</main>

<script>
/* ========================================================================
   CONFIG — แก้ 4 ค่านี้ให้ตรงกับ repo ของคุณก่อนใช้งานจริง
   การเพิ่ม/แก้รายชื่อทำโดยตรงที่ไฟล์ data/players.json บน GitHub
   (แก้ไฟล์ผ่านหน้าเว็บ GitHub หรือ clone ลงเครื่องมาแก้ก็ได้) หน้าเว็บนี้
   มีหน้าที่แค่อ่านไฟล์นั้นมาแสดงผล ไม่มีการเขียนกลับจากฝั่งเว็บ
   ======================================================================== */
const CONFIG = {
  GITHUB_OWNER: "YOUR_GITHUB_USERNAME",   // เช่น "taraRook"
  GITHUB_REPO: "YOUR_REPO_NAME",          // เช่น "holly-project"
  GITHUB_BRANCH: "main",                  // ชื่อ branch ที่ใช้งาน
  DATA_PATH: "data/players.json"          // path ของไฟล์ข้อมูลใน repo
};
/* ======================================================================== */

let playersData = [];

const rawUrl = () =>
  `https://raw.githubusercontent.com/${CONFIG.GITHUB_OWNER}/${CONFIG.GITHUB_REPO}/${CONFIG.GITHUB_BRANCH}/${CONFIG.DATA_PATH}?t=${Date.now()}`;

const ytIcon = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.4 3.5 12 3.5 12 3.5s-7.4 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c2 .6 9.4.6 9.4.6s7.4 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/></svg>`;
const ttIcon = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 2h-3.2v14.3a2.9 2.9 0 1 1-2.1-2.8V10a6.1 6.1 0 1 0 5.3 6V8.8a8.1 8.1 0 0 0 4.7 1.5V7.1a4.8 4.8 0 0 1-4.7-5.1Z"/></svg>`;

async function loadPlayers(){
  try{
    const res = await fetch(rawUrl(), {cache:"no-store"});
    if(!res.ok) throw new Error("fetch failed");
    const json = await res.json();
    playersData = json.players || [];
  }catch(e){
    // Fallback for local testing before CONFIG is wired up to a real repo
    const local = await fetch("data/players.json").catch(()=>null);
    if(local && local.ok){
      const json = await local.json();
      playersData = json.players || [];
    } else {
      playersData = [];
    }
  }
  populateFilters();
  render();
}

function populateFilters(){
  const roleSel = document.getElementById("roleFilter");
  const roles = [...new Set(playersData.map(p=>p.role).filter(Boolean))].sort();
  roleSel.innerHTML = '<option value="">ทุกบทบาท</option>' +
    roles.map(r=>`<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join("");

  const houseSel = document.getElementById("houseFilter");
  const houses = [...new Set(playersData.map(p=>p.house).filter(Boolean))];
  houseSel.innerHTML = '<option value="">ทุกตระกูล</option>' +
    houses.map(h=>`<option value="${escapeHtml(h)}">${escapeHtml(h)}</option>`).join("");
}

function channelSearchText(p){
  return (p.channels||[]).map(c => `${c.url||""} ${c.label||""}`).join(" ");
}

function render(){
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const roleFilter = document.getElementById("roleFilter").value;
  const houseFilter = document.getElementById("houseFilter").value;
  const grid = document.getElementById("grid");
  const empty = document.getElementById("emptyState");

  const filtered = playersData.filter(p=>{
    const haystack = [p.character, p.role, p.house, channelSearchText(p)].join(" ").toLowerCase();
    const matchesQ = !q || haystack.includes(q);
    const matchesRole = !roleFilter || p.role === roleFilter;
    const matchesHouse = !houseFilter || p.house === houseFilter;
    return matchesQ && matchesRole && matchesHouse;
  });

  document.getElementById("countTag").textContent = `${filtered.length} รายชื่อ`;

  if(filtered.length === 0){
    grid.innerHTML = "";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  grid.innerHTML = filtered.map(p=>`
    <div class="card">
      <span class="role-badge">${escapeHtml(p.role||"—")}</span>
      <h3>${escapeHtml(p.character||"—")}</h3>
      <p class="charname">ตระกูล <b>${escapeHtml(p.house||"—")}</b></p>
      <div class="channels">
        ${(p.channels||[]).map(c => `
          <a class="chan-btn" href="${escapeAttr(c.url)}" target="_blank" rel="noopener">
            ${c.platform === "youtube" ? ytIcon : ttIcon}
            ${c.platform === "youtube" ? "YouTube" : "TikTok"}${c.label ? ` · ${escapeHtml(c.label)}` : ""}
          </a>`).join("")}
        ${(!p.channels || p.channels.length === 0) ? `<span class="no-channel">ยังไม่มีลิงก์ช่อง</span>` : ""}
      </div>
    </div>
  `).join("");
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

document.getElementById("searchInput").addEventListener("input", render);
document.getElementById("roleFilter").addEventListener("change", render);
document.getElementById("houseFilter").addEventListener("change", render);

loadPlayers();
</script>
</body>
</html>
